<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield/Badge -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg-grad)" stroke="#38bdf8" stroke-width="3.5" stroke-opacity="0.4" filter="url(#glow)"/>

  <!-- Network Interconnection Edges -->
  <path d="M64 28 L32 88" stroke="#3b82f6" stroke-width="4.5" stroke-opacity="0.7" stroke-linecap="round"/>
  <path d="M64 28 L96 88" stroke="#8b5cf6" stroke-width="4.5" stroke-opacity="0.7" stroke-linecap="round"/>
  <path d="M32 88 L96 88" stroke="#ec4899" stroke-width="5" stroke-dasharray="6,4" stroke-linecap="round"/>
  
  <!-- Central Hub Lines -->
  <path d="M64 28 L64 62" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.9"/>
  <path d="M32 88 L64 62" stroke="#10b981" stroke-width="4" stroke-opacity="0.9"/>
  <path d="M96 88 L64 62" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.9"/>

  <!-- Outer Satellite Nodes -->
  <circle cx="64" cy="28" r="13" fill="url(#primary-grad)" stroke="#ffffff" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="32" cy="88" r="11" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="96" cy="88" r="11" fill="#8b5cf6" stroke="#ffffff" stroke-width="2"/>

  <!-- Central Holding/Crown Node -->
  <circle cx="64" cy="62" r="16" fill="url(#accent-grad)" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Small Star/Crown Center Detail -->
  <polygon points="64,54 67,60 74,60 69,64 71,71 64,67 57,71 59,64 54,60 61,60" fill="#ffffff"/>
</svg>
